name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design-system-site
        uses: actions/checkout@v4

      - name: Checkout tahche-design-tokens (private, sibling path)
        uses: actions/checkout@v4
        with:
          repository: karl-tahche/tahche-design-tokens
          token: ${{ secrets.TOKENS_REPO_TOKEN }}
          path: ../tahche-design-tokens

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build tahche-design-tokens
        working-directory: ../tahche-design-tokens
        run: |
          npm ci
          npm run build

      - name: Install site dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
